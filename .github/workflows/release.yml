name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./dytes.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 dytes.json ${version} 不一致" >&2
            exit 1
          fi

      - name: Publish to S3
        uses: dytescn/dytes@v0.1.9
        with:
          command: publish
          args: --force
